[project]
name = "cam-head-tracker"
version = "0.2.3"
description = "Camera-based head tracking app"
requires-python = ">=3.13,<3.14"
dependencies = [
  "mediapipe>=1.0.0",
  "numpy>=2.5.2",
  "pillow>=12.3.0",
]

[dependency-groups]
dev = [
  "pip-licenses>=5.5.5",
  "pyinstaller>=6.22.0",
  "pytest>=9.1.1",
  "ruff>=0.16.2",
]

[tool.pip-licenses]
format = "plain-vertical"
with-license-file = "true"
no-license-path = "true"
ignore-packages = [
  "pip-licenses",
  "pyinstaller",
  "pytest",
  "ruff",
]
output-file = "NOTICE.txt"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
